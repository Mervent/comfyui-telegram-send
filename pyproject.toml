[project]
name = "comfyui-telegram"
version = "0.1.0"
description = "ComfyUI custom node for Telegram integration"
readme = "CLAUDE.md"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests>=2.25.0",
    "torch>=1.9.0",
    "Pillow>=8.0.0",
    "pytest>=8.3.5",
    "pytest-mock>=3.14.1",
    "ruff>=0.12.2",
    "numpy>=2.2.0,<2.3.0",
]


[project.urls]
Homepage = "https://github.com/mervent/comfyui-telegram"
Repository = "https://github.com/mervent/comfyui-telegram"
Issues = "https://github.com/mervent/comfyui-telegram/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--strict-markers"]
